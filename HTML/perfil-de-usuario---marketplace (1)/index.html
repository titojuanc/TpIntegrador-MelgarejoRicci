<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil de Usuario - Marketplace Escolar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- React & Babel for in-browser compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      /* Custom scrollbar for aesthetic */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #ccc;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #aaa;
      }
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fade-in 0.5s ease-out forwards;
      }
    </style>
    
    <!-- Import Map for Modules: Fixed to use consistent React 18 versions -->
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.292.0?deps=react@18.2.0",
    "@google/genai": "https://esm.run/@google/genai",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>

    <!-- API Key Shim -->
    <script>
      window.process = {
        env: {
          API_KEY: '' // The API key is expected to be injected or manually set here if needed
        }
      };
    </script>

    <!-- Main Application Script -->
    <script type="text/babel" data-type="module">
      import React, { useState } from 'react';
      import { createRoot } from 'react-dom/client';
      import { Search, User, Menu, ShoppingCart, CreditCard, Star, Sparkles } from 'lucide-react';
      import { GoogleGenAI } from "@google/genai";

      // --- CONSTANTS & DATA ---
      const UserLevel = {
        BRONZE: 'BRONCE',
        SILVER: 'PLATA',
        GOLD: 'ORO'
      };

      const MOCK_USER = {
        id: 'u1',
        name: 'Nombre de usuario',
        level: UserLevel.BRONZE,
        reputationPoints: 1250,
        publicationCount: 12,
        reviews: [
          {
            id: 'r1',
            userName: 'Ana García',
            rating: 5,
            comment: 'Excelente vendedor, muy rápido.',
            date: '12/05/2024'
          },
          {
            id: 'r2',
            userName: 'Carlos Ruiz',
            rating: 4,
            comment: 'Buen producto pero tardó un poco.',
            date: '10/05/2024'
          },
          {
            id: 'r3',
            userName: 'Luisa Méndez',
            rating: 5,
            comment: 'Todo perfecto, recomendable.',
            date: '08/05/2024'
          },
          {
            id: 'r4',
            userName: 'Jorge P.',
            rating: 5,
            comment: 'Muy amable, gracias.',
            date: '01/05/2024'
          },
          {
            id: 'r5',
            userName: 'M. Torres',
            rating: 4,
            comment: 'Todo bien.',
            date: '28/04/2024'
          },
          {
            id: 'r6',
            userName: 'Estudiante123',
            rating: 5,
            comment: 'Excelente.',
            date: '20/04/2024'
          }
        ],
        publications: [
          {
            id: 'p1',
            title: 'Kit de Geometría Completo',
            category: 'Matemáticas',
            price: 12500,
            description: 'Juego de escuadras, compás de precisión y regla graduada. Ideal para dibujo técnico.',
            imageUrl: 'https://images.unsplash.com/photo-1588412079929-790b9f593d8e?auto=format&fit=crop&w=300&q=80',
            promoted: true
          },
          {
            id: 'p2',
            title: 'Libros de Biología Avanzada',
            category: 'Libros',
            price: 18000,
            description: 'Pack de 3 libros de biología celular y anatomía. Poco uso, sin subrayados.',
            imageUrl: 'https://images.unsplash.com/photo-1532012197267-da84d127e765?auto=format&fit=crop&w=300&q=80',
            promoted: true
          },
          {
            id: 'p3',
            title: 'Mochila Ergonómica Azul',
            category: 'Accesorios',
            price: 25000,
            description: 'Mochila impermeable con soporte lumbar y compartimento para laptop.',
            imageUrl: 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=300&q=80',
            promoted: true
          }
        ]
      };

      // --- SERVICES ---
      const generateReputationSummary = async (reviews, userName) => {
        if (!window.process.env.API_KEY) {
          console.warn("API Key not found");
          return "Configure su API KEY para ver el resumen IA.";
        }

        try {
          const ai = new GoogleGenAI({ apiKey: window.process.env.API_KEY });
          
          const reviewText = reviews.map(r => `- ${r.userName} (${r.rating}/5): ${r.comment}`).join('\n');
          
          const prompt = `
            You are an AI assistant for a marketplace profile page.
            Analyze the following reviews for user "${userName}".
            Provide a short, encouraging 2-sentence summary of their reputation based on these reviews.
            Highlight their key strengths.
            
            Reviews:
            ${reviewText}
          `;

          const response = await ai.models.generateContent({
            model: 'gemini-2.5-flash',
            contents: prompt,
          });

          return response.text || "No summary available.";
        } catch (error) {
          console.error("Error generating summary:", error);
          return "No se pudo generar el resumen en este momento.";
        }
      };

      // --- COMPONENTS ---

      const Header = () => {
        return (
          <header className="w-full bg-[#1a1b41] py-4 px-6 shadow-md text-white sticky top-0 z-50">
            <div className="container mx-auto flex items-center justify-between gap-4">
              <div className="flex items-center gap-4">
                <div className="bg-pink-100 text-[#1a1b41] p-2 rounded-full cursor-pointer hover:bg-pink-200 transition">
                   <Menu size={24} />
                </div>
              </div>

              <div className="flex-1 max-w-2xl relative hidden md:block">
                <input 
                  type="text" 
                  placeholder="Buscar útiles, libros y más..." 
                  className="w-full py-2 px-4 pr-10 rounded-full text-gray-800 focus:outline-none focus:ring-2 focus:ring-pink-300"
                />
                <Search className="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400" size={20} />
              </div>

              <div className="flex items-center gap-4 text-sm font-medium">
                 <div className="hidden md:flex gap-2">
                    <button className="px-4 py-1 bg-pink-100 text-[#1a1b41] rounded-full hover:bg-pink-200 transition shadow-sm">
                      Crear cuenta
                    </button>
                    <button className="px-4 py-1 border border-pink-100 text-pink-100 rounded-full hover:bg-[#2a2b55] transition">
                      Ingresar
                    </button>
                 </div>
                 <div className="bg-pink-100 text-[#1a1b41] p-2 rounded-full cursor-pointer hover:bg-pink-200 transition">
                    <User size={24} />
                 </div>
              </div>
            </div>
          </header>
        );
      };

      const Footer = () => {
        return (
          <footer className="w-full bg-[#1a1b41] text-white mt-12">
            <div className="container mx-auto px-6 py-12 flex flex-col md:flex-row justify-between items-start">
              
              <div className="mb-8 md:mb-0">
                <h3 className="text-lg uppercase tracking-widest text-pink-100 mb-2">Únete para más</h3>
                <button className="text-2xl font-serif italic border-b border-white pb-1 hover:text-pink-200 transition">
                  Registrate
                </button>
              </div>

              <div className="text-right text-xs md:text-sm text-gray-300 space-y-2 w-full md:w-auto">
                <p className="hover:text-white cursor-pointer transition-colors">TERMINOS Y CONDICIONES</p>
                <p className="hover:text-white cursor-pointer transition-colors">CONTACTANOS</p>
                <p className="hover:text-white cursor-pointer transition-colors">POLITICA ENVIO</p>
                
                <div className="flex justify-end gap-2 mt-4 pt-4">
                   <div className="w-8 h-5 bg-blue-600 rounded opacity-80"></div>
                   <div className="w-8 h-5 bg-red-500 rounded opacity-80"></div>
                   <div className="w-8 h-5 bg-orange-500 rounded opacity-80"></div>
                   <div className="w-8 h-5 bg-blue-400 rounded opacity-80"></div>
                </div>
                <p className="text-[10px] mt-4 text-gray-500">
                   © 2025 • MercadoTemplate | Tecnología de Shopify | Designed by UI/UX Experts
                </p>
              </div>
            </div>
          </footer>
        );
      };

      const StarRating = ({ rating, size = 14 }) => {
        return (
          <div className="flex gap-0.5">
            {[1, 2, 3, 4, 5].map((star) => (
              <Star
                key={star}
                size={size}
                className={`${star <= rating ? 'fill-[#1a1b41] text-[#1a1b41]' : 'text-gray-300'}`}
              />
            ))}
          </div>
        );
      };

      const StatsTable = ({ level, reputation, count }) => {
        const getLevelColor = (l) => {
          switch (l) {
            case UserLevel.GOLD: return 'bg-yellow-400 text-yellow-900';
            case UserLevel.SILVER: return 'bg-gray-300 text-gray-800';
            case UserLevel.BRONZE: return 'bg-orange-400 text-[#1a1b41]';
            default: return 'bg-gray-200';
          }
        };

        return (
          <div className="flex flex-col gap-3 w-full max-w-md">
            <div className="grid grid-cols-2 gap-4">
              <div className="bg-[#e6c4c4] bg-opacity-60 p-3 flex items-center justify-center font-bold text-[#1a1b41] rounded shadow-sm">
                Nivel:
              </div>
              <div className={`${getLevelColor(level)} p-3 flex items-center justify-center font-bold uppercase tracking-wide rounded shadow-sm`}>
                {level}
              </div>
            </div>

            <div className="grid grid-cols-2 gap-4">
              <div className="bg-[#e6c4c4] bg-opacity-60 p-3 flex items-center justify-center font-bold text-[#1a1b41] rounded shadow-sm">
                Reputación:
              </div>
              <div className="bg-[#dcbaba] bg-opacity-40 p-3 flex items-center justify-center font-medium text-gray-700 rounded shadow-sm">
                {reputation} pts.
              </div>
            </div>

            <div className="grid grid-cols-2 gap-4">
              <div className="bg-[#e6c4c4] bg-opacity-60 p-3 flex items-center justify-center font-bold text-[#1a1b41] rounded shadow-sm">
                Cantidad pub.
              </div>
              <div className="bg-[#dcbaba] bg-opacity-40 p-3 flex items-center justify-center font-medium text-gray-700 rounded shadow-sm">
                {count}
              </div>
            </div>
          </div>
        );
      };

      const PublicationCard = ({ pub }) => {
        return (
          <div className="bg-white bg-opacity-60 border border-white shadow-sm rounded-lg overflow-hidden flex h-40 md:h-48 transition hover:shadow-md group cursor-pointer">
            <div className="w-1/3 relative bg-gray-200 overflow-hidden">
              <img 
                src={pub.imageUrl} 
                alt={pub.title} 
                className="w-full h-full object-cover opacity-90 group-hover:scale-105 transition-transform duration-500"
              />
              <div className="absolute inset-0 bg-gradient-to-r from-gray-900/10 to-transparent pointer-events-none" />
            </div>

            <div className="w-2/3 p-4 flex flex-col justify-between relative">
              <div>
                {pub.promoted && (
                   <div className="absolute top-4 right-4 bg-green-500 text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase shadow-sm">
                     Promocionado
                   </div>
                )}
                <p className="text-xs text-gray-500 mb-1 uppercase tracking-wider font-semibold">{pub.category}</p>
                <h3 className="font-bold text-[#1a1b41] leading-tight mb-1 text-lg">{pub.title}</h3>
                <p className="text-xl font-extrabold text-[#1a1b41] mb-2">
                  ${pub.price.toLocaleString('es-CL')}
                </p>
                <p className="text-xs text-gray-600 line-clamp-2 leading-relaxed">
                  {pub.description}
                </p>
              </div>
              
              <div className="text-right">
                 <span className="text-[10px] text-gray-400 group-hover:text-pink-600 transition-colors font-semibold tracking-wide">VER DETALLE &rarr;</span>
              </div>
            </div>
          </div>
        );
      };

      // --- MAIN APP ---
      const App = () => {
        const [aiSummary, setAiSummary] = useState(null);
        const [loadingAi, setLoadingAi] = useState(false);

        const handleGenerateSummary = async () => {
          setLoadingAi(true);
          const summary = await generateReputationSummary(MOCK_USER.reviews, MOCK_USER.name);
          setAiSummary(summary);
          setLoadingAi(false);
        };

        return (
          <div className="min-h-screen bg-[#fff1f2] flex flex-col font-sans selection:bg-pink-200 selection:text-[#1a1b41]">
            <Header />

            <main className="flex-grow container mx-auto px-4 py-8 md:px-8 max-w-6xl">
              
              {/* Hero Section */}
              <div className="flex flex-col items-center mb-12 animate-fade-in">
                <div className="w-32 h-32 rounded-full border-2 border-[#1a1b41] flex items-center justify-center mb-4 bg-white shadow-md hover:scale-105 transition-transform duration-300">
                   <User size={64} strokeWidth={1} className="text-[#1a1b41]" />
                </div>
                <h1 className="text-3xl md:text-4xl font-bold text-[#1a1b41] tracking-wide">
                  {MOCK_USER.name}
                </h1>
                <p className="text-gray-500 text-sm mt-1 font-medium">Usuario verificado • Miembro desde 2022</p>
                
                {!aiSummary && !loadingAi && (
                  <button 
                    onClick={handleGenerateSummary}
                    className="mt-4 flex items-center gap-2 text-xs bg-white border border-purple-200 text-purple-700 px-4 py-1.5 rounded-full shadow-sm hover:bg-purple-50 hover:shadow-md transition-all active:scale-95"
                  >
                    <Sparkles size={14} />
                    Analizar reputación con IA
                  </button>
                )}
                
                {loadingAi && (
                  <div className="mt-4 flex items-center gap-2 text-xs text-purple-600">
                    <span className="relative flex h-2 w-2">
                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-purple-400 opacity-75"></span>
                      <span className="relative inline-flex rounded-full h-2 w-2 bg-purple-500"></span>
                    </span>
                    Generando análisis...
                  </div>
                )}

                {aiSummary && (
                   <div className="mt-4 max-w-lg text-center bg-white/80 border border-purple-100 p-4 rounded-lg text-sm text-purple-900 italic shadow-sm animate-fade-in">
                     <Sparkles size={12} className="inline mr-2 text-purple-500 mb-1"/>
                     "{aiSummary}"
                   </div>
                )}
              </div>

              {/* Main Grid */}
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-16">
                
                {/* Left: Stats & Reviews */}
                <div className="lg:col-span-5 space-y-12">
                  <section className="flex flex-col items-center lg:items-start">
                    <StatsTable 
                      level={MOCK_USER.level} 
                      reputation={MOCK_USER.reputationPoints} 
                      count={MOCK_USER.publicationCount} 
                    />
                  </section>

                  <section>
                    <h2 className="text-xl font-bold text-[#1a1b41] mb-6 border-b-2 border-pink-200 inline-block pb-1">Calificaciones</h2>
                    <div className="grid grid-cols-2 gap-4">
                      {MOCK_USER.reviews.map((review) => (
                        <div key={review.id} className="bg-white bg-opacity-50 border border-white/60 p-3 rounded-lg shadow-sm hover:shadow-md transition duration-200 flex flex-col justify-center min-h-[70px]">
                          <div className="flex justify-between items-center mb-1.5">
                            <span className="font-bold text-xs text-[#1a1b41] truncate mr-1" title={review.userName}>{review.userName}</span>
                            <span className="text-[10px] text-gray-500 whitespace-nowrap">{review.date}</span>
                          </div>
                          <StarRating rating={review.rating} size={14} />
                        </div>
                      ))}
                    </div>
                  </section>
                </div>

                {/* Right: Publications */}
                <div className="lg:col-span-7 border-l-0 lg:border-l border-pink-200 lg:pl-12">
                  <h2 className="text-xl font-bold text-[#1a1b41] mb-6 border-b-2 border-pink-200 inline-block pb-1">Últimas publicaciones</h2>
                  
                  <div className="space-y-6">
                    {MOCK_USER.publications.map((pub) => (
                      <PublicationCard key={pub.id} pub={pub} />
                    ))}
                  </div>
                  
                  <div className="mt-8 text-center">
                    <button className="text-sm text-[#1a1b41] font-bold hover:text-pink-600 transition border-b-2 border-dotted border-[#1a1b41] hover:border-pink-600 pb-0.5 uppercase tracking-wide">
                      Ver todas las publicaciones
                    </button>
                  </div>
                </div>

              </div>
            </main>

            <Footer />
          </div>
        );
      };

      // Mount the app
      const rootElement = document.getElementById('root');
      const root = createRoot(rootElement);
      root.render(<App />);
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
