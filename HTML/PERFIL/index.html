<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil de Usuario - Marketplace Escolar</title>
    
    <!-- 1. Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- 3. React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- 4. Babel (to compile JSX in browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body { font-family: 'Inter', sans-serif; }
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fade-in 0.5s ease-out forwards;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "vite": "https://aistudiocdn.com/vite@^7.2.2",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-[#fff1f2]">
    <div id="root"></div>

    <script type="text/babel">
        // --- 1. CONSTANTS & MOCK DATA ---
        const UserLevel = {
            BRONZE: 'BRONCE',
            SILVER: 'PLATA',
            GOLD: 'ORO'
        };

        const STOCK_IMAGES = [
            'https://images.unsplash.com/photo-1588412079929-790b9f593d8e?auto=format&fit=crop&w=300&q=80', // Geometry
            'https://images.unsplash.com/photo-1532012197267-da84d127e765?auto=format&fit=crop&w=300&q=80', // Books
            'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=300&q=80', // Backpack
            'https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=300&q=80', // Pencils
            'https://images.unsplash.com/photo-1497633762265-9d179a990aa6?auto=format&fit=crop&w=300&q=80', // School Library
        ];

        const MOCK_USER = {
            id: 'u1',
            name: 'Cargando usuario...',
            level: UserLevel.BRONZE,
            reputationPoints: 0,
            publicationCount: 0,
            reviews: [],
            publications: []
        };

        // --- 2. ICONS (Inline SVGs to avoid dependency issues) ---
        const IconUser = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        );
        const IconMenu = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
        );
        const IconSearch = ({ size = 20, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        );
        const IconStar = ({ size = 14, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        );

        // --- 3. COMPONENTS ---

        // Star Rating Component
        const StarRating = ({ rating, size = 14 }) => {
            return (
                <div className="flex gap-0.5">
                    {[1, 2, 3, 4, 5].map((star) => (
                        <IconStar
                            key={star}
                            size={size}
                            className={`${star <= rating ? 'text-[#1a1b41]' : 'text-gray-300'}`}
                        />
                    ))}
                </div>
            );
        };

        // Stats Table Component
        const StatsTable = ({ level, reputation, count }) => {
            const getLevelColor = (l) => {
                switch (l) {
                    case UserLevel.GOLD: return 'bg-yellow-400 text-yellow-900';
                    case UserLevel.SILVER: return 'bg-gray-300 text-gray-800';
                    case UserLevel.BRONZE: return 'bg-orange-400 text-[#1a1b41]';
                    default: return 'bg-gray-200';
                }
            };

            return (
                <div className="flex flex-col gap-3 w-full max-w-md">
                    <div className="grid grid-cols-2 gap-4">
                        <div className="bg-[#e6c4c4] bg-opacity-60 p-3 flex items-center justify-center font-bold text-[#1a1b41] rounded shadow-sm">Nivel:</div>
                        <div className={`${getLevelColor(level)} p-3 flex items-center justify-center font-bold uppercase tracking-wide rounded shadow-sm`}>{level}</div>
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                        <div className="bg-[#e6c4c4] bg-opacity-60 p-3 flex items-center justify-center font-bold text-[#1a1b41] rounded shadow-sm">Reputación:</div>
                        <div className="bg-[#dcbaba] bg-opacity-40 p-3 flex items-center justify-center font-medium text-gray-700 rounded shadow-sm">{reputation} pts.</div>
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                        <div className="bg-[#e6c4c4] bg-opacity-60 p-3 flex items-center justify-center font-bold text-[#1a1b41] rounded shadow-sm">Cantidad pub.</div>
                        <div className="bg-[#dcbaba] bg-opacity-40 p-3 flex items-center justify-center font-medium text-gray-700 rounded shadow-sm">{count}</div>
                    </div>
                </div>
            );
        };

        // Publication Card Component
        const PublicationCard = ({ pub }) => {
            return (
                <div className="bg-white bg-opacity-60 border border-white shadow-sm rounded-lg overflow-hidden flex h-32 md:h-36 transition hover:shadow-md">
                    <div className="w-1/3 relative bg-gray-200">
                        <img src={pub.imageUrl} alt={pub.title} className="w-full h-full object-cover opacity-90"/>
                        <div className="absolute inset-0 bg-gradient-to-r from-gray-900/10 to-transparent pointer-events-none" />
                    </div>
                    <div className="w-2/3 p-4 flex flex-col justify-center relative">
                        <div>
                            {pub.promoted && (
                                <div className="absolute top-3 right-3 bg-green-500 text-white text-[9px] font-bold px-2 py-0.5 rounded uppercase">Promocionado</div>
                            )}
                            <p className="text-[10px] uppercase tracking-wider text-gray-500 mb-1">{pub.category}</p>
                            <h3 className="font-bold text-[#1a1b41] leading-tight mb-1 text-lg">{pub.title}</h3>
                            <p className="text-xl font-bold text-[#1a1b41]">${pub.price.toLocaleString('es-CL')}</p>
                        </div>
                        <div className="absolute bottom-3 right-4">
                           <span className="text-[10px] text-gray-400 hover:text-pink-500 transition cursor-pointer">Ver detalle &rarr;</span>
                        </div>
                    </div>
                </div>
            );
        };

        // Header Component
        const Header = () => {
            return (
                <header className="w-full bg-[#1a1b41] py-4 px-6 shadow-md text-white">
                    <div className="container mx-auto flex items-center justify-between gap-4">
                        <div className="flex items-center gap-4">
                            <div className="bg-pink-100 text-[#1a1b41] p-2 rounded-full"><IconMenu size={24} /></div>
                        </div>
                        <div className="flex-1 max-w-2xl relative">
                            <input type="text" placeholder="Buscar productos, marcas y más..." className="w-full py-2 px-4 pr-10 rounded-full text-gray-800 focus:outline-none focus:ring-2 focus:ring-pink-300"/>
                            <IconSearch className="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400" size={20} />
                        </div>
                        <div className="flex items-center gap-4 text-sm font-medium">
                           <div className="hidden md:flex gap-2">
                              <button className="px-4 py-1 bg-pink-100 text-[#1a1b41] rounded-full hover:bg-pink-200 transition">Crear cuenta</button>
                              <button className="px-4 py-1 border border-pink-100 text-pink-100 rounded-full hover:bg-[#2a2b55] transition">Ingresar</button>
                           </div>
                           <div className="bg-pink-100 text-[#1a1b41] p-2 rounded-full"><IconUser size={24} /></div>
                        </div>
                    </div>
                </header>
            );
        };

        // Footer Component
        const Footer = () => {
            return (
                <footer className="w-full bg-[#1a1b41] text-white mt-12">
                    <div className="container mx-auto px-6 py-12 flex flex-col md:flex-row justify-between items-start">
                        <div className="mb-8 md:mb-0">
                            <h3 className="text-lg uppercase tracking-widest text-pink-100 mb-2">Únete para más</h3>
                            <button className="text-2xl font-serif italic border-b border-white pb-1 hover:text-pink-200 transition">Registrate</button>
                        </div>
                        <div className="text-right text-xs md:text-sm text-gray-300 space-y-2">
                            <p className="hover:text-white cursor-pointer">TERMINOS Y CONDICIONES</p>
                            <p className="hover:text-white cursor-pointer">CONTACTANOS</p>
                            <p className="hover:text-white cursor-pointer">POLITICA ENVIO</p>
                            <div className="flex justify-end gap-2 mt-4 pt-4">
                                <div className="w-8 h-5 bg-blue-600 rounded"></div>
                                <div className="w-8 h-5 bg-red-500 rounded"></div>
                                <div className="w-8 h-5 bg-orange-500 rounded"></div>
                                <div className="w-8 h-5 bg-blue-400 rounded"></div>
                            </div>
                            <p className="text-[10px] mt-4 text-gray-500">© 2025 • MercadoTemplate</p>
                        </div>
                    </div>
                </footer>
            );
        };

        // --- 4. MAIN APP COMPONENT ---
        const App = () => {
            const [userData, setUserData] = React.useState(MOCK_USER);

            React.useEffect(() => {
                const fetchData = async () => {
                    let currentUser = { ...MOCK_USER };
                    
                    // 1. Fetch User Profile
                    try {
                        const userRes = await fetch('http://localhost:8080/GET/api/usuarios/20');
                        if (userRes.ok) {
                            const userJson = await userRes.json();
                            currentUser.name = userJson.nombre || currentUser.name;
                            currentUser.reputationPoints = userJson.puntos ?? currentUser.reputationPoints;
                            currentUser.publicationCount = userJson.cantidad_publicaciones ?? currentUser.publicationCount;
                            
                            if (userJson.nivel) {
                                const apiLevel = userJson.nivel.toString().toUpperCase();
                                if (apiLevel === 'BRONCE') currentUser.level = UserLevel.BRONZE;
                                else if (apiLevel === 'PLATA') currentUser.level = UserLevel.SILVER;
                                else if (apiLevel === 'ORO') currentUser.level = UserLevel.GOLD;
                            }
                        }
                    } catch (e) { console.warn("API Usuario falló o bloqueada por CORS", e); }

                    // 2. Fetch Reputation/Reviews
                    try {
                        const reviewsRes = await fetch('http://localhost:8080/GET/api/usuarios/20/reputacion');
                        if (reviewsRes.ok) {
                            const reviewsJson = await reviewsRes.json();
                            if (reviewsJson.calificaciones && Array.isArray(reviewsJson.calificaciones)) {
                                currentUser.reviews = reviewsJson.calificaciones.map((item, index) => ({
                                    id: `review-api-${index}`,
                                    userName: `${item.usuario.nombre} ${item.usuario.apellido}`.trim(),
                                    rating: item.calificacion,
                                    productName: item.publicacion?.nombre || 'Producto'
                                }));
                            }
                        }
                    } catch (e) { console.warn("API Reputacion falló o bloqueada por CORS", e); }

                    // 3. Fetch Publications
                    try {
                        const pubsRes = await fetch('http://localhost:8080/GET/api/usuarios/20/publicaciones');
                        if (pubsRes.ok) {
                            const pubsJson = await pubsRes.json();
                            if(Array.isArray(pubsJson)) {
                                currentUser.publications = pubsJson.map((item, index) => ({
                                    id: `pub-api-${index}`,
                                    title: item.nombre,
                                    price: item.precio,
                                    category: item.categoria,
                                    imageUrl: STOCK_IMAGES[index % STOCK_IMAGES.length],
                                    promoted: false
                                }));
                            }
                        }
                    } catch (e) { console.warn("API Publicaciones falló o bloqueada por CORS", e); }

                    setUserData(currentUser);
                };

                fetchData();
            }, []);

            return (
                <div className="min-h-screen flex flex-col font-sans selection:bg-pink-200 selection:text-[#1a1b41]">
                    <Header />
                    <main className="flex-grow container mx-auto px-4 py-8 md:px-8 max-w-6xl">
                        
                        {/* Hero Section */}
                        <div className="flex flex-col items-center mb-12 animate-fade-in">
                            <div className="w-32 h-32 rounded-full border-2 border-[#1a1b41] flex items-center justify-center mb-4 bg-white shadow-md hover:scale-105 transition-transform duration-300">
                               <IconUser size={64} className="text-[#1a1b41]" />
                            </div>
                            <h1 className="text-3xl md:text-4xl font-bold text-[#1a1b41] tracking-wide">{userData.name}</h1>
                        </div>

                        {/* Content Grid */}
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-16">
                            
                            {/* Left Col: Stats & Reviews */}
                            <div className="lg:col-span-5 space-y-12">
                                <section className="flex flex-col items-center lg:items-start">
                                    <StatsTable level={userData.level} reputation={userData.reputationPoints} count={userData.publicationCount} />
                                </section>

                                <section>
                                    <h2 className="text-xl font-bold text-[#1a1b41] mb-6 border-b-2 border-pink-200 inline-block pb-1">Calificaciones</h2>
                                    <div className="grid grid-cols-2 gap-4">
                                        {userData.reviews.length > 0 ? userData.reviews.map((review) => (
                                            <div key={review.id} className="bg-white bg-opacity-50 border border-white/60 p-3 rounded-lg shadow-sm hover:shadow-md transition duration-200 flex flex-col justify-center min-h-[70px]">
                                                <div className="flex justify-between items-center mb-1.5 gap-2">
                                                    <span className="font-bold text-xs text-[#1a1b41] truncate" title={review.userName}>{review.userName}</span>
                                                    <span className="text-[9px] text-gray-500 truncate max-w-[80px] text-right" title={review.productName}>{review.productName}</span>
                                                </div>
                                                <div className="flex justify-between items-end">
                                                    <StarRating rating={review.rating} />
                                                </div>
                                            </div>
                                        )) : <p className="text-sm text-gray-500">Cargando calificaciones o sin datos...</p>}
                                    </div>
                                </section>
                            </div>

                            {/* Right Col: Publications */}
                            <div className="lg:col-span-7 border-l-0 lg:border-l border-pink-200 lg:pl-12">
                                <h2 className="text-xl font-bold text-[#1a1b41] mb-6 border-b-2 border-pink-200 inline-block pb-1">Últimas publicaciones</h2>
                                <div className="space-y-6">
                                    {userData.publications.length > 0 ? (
                                        userData.publications.map((pub) => <PublicationCard key={pub.id} pub={pub} />)
                                    ) : (
                                        <p className="text-gray-500 italic text-sm">Buscando publicaciones...</p>
                                    )}
                                </div>
                                <div className="mt-8 text-center">
                                    <button className="text-sm text-[#1a1b41] font-bold hover:text-pink-600 transition border-b-2 border-dotted border-[#1a1b41] hover:border-pink-600 pb-0.5 uppercase tracking-wide">
                                        Ver todas las publicaciones
                                    </button>
                                </div>
                            </div>

                        </div>
                    </main>
                    <Footer />
                </div>
            );
        };

        // --- 5. RENDER ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
