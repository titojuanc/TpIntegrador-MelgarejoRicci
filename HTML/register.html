<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-commerce App - Registro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        // --- REUSABLE COMPONENTS (Shared across pages) ---
        const LogoIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" className="h-10 w-10 text-blue-900" viewBox="0 0 20 20" fill="currentColor"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z" /></svg>);
        const SearchIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>);
        const UserIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" className="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0z" /></svg>);

        const Header = () => (
            <header className="bg-blue-900 shadow-md sticky top-0 z-50">
                <div className="container mx-auto px-4 py-3 flex items-center justify-between">
                    <a href="./index.html" className="flex items-center">
                        <div className="bg-white p-1 rounded-full"><LogoIcon /></div>
                    </a>
                    <div className="flex-1 max-w-xl mx-4 hidden md:flex items-center bg-white rounded-md">
                        <input type="text" placeholder="Buscar productos, servicios y más..." className="w-full py-2 px-4 text-gray-700 rounded-l-md focus:outline-none" />
                        <button className="p-2"><SearchIcon /></button>
                    </div>
                    <div className="flex items-center space-x-4">
                        <div className="hidden sm:flex flex-col">
                            <a href="./login.html" className="text-center bg-white text-blue-900 font-semibold py-1 px-4 rounded-t-md hover:bg-gray-200 transition duration-300 text-xs">Iniciar sesión</a>
                            <a href="./register.html" className="text-center bg-black text-white font-semibold py-1 px-4 rounded-b-md hover:bg-gray-700 transition duration-300 text-xs">Registrarse</a>
                        </div>
                        <a href="./profile.html" className="p-1 border-2 border-white rounded-full hover:bg-white/20 transition-colors"><UserIcon /></a>
                    </div>
                </div>
                <div className="container mx-auto px-4 pb-3 md:hidden">
                    <div className="flex items-center bg-white rounded-md">
                        <input type="text" placeholder="Buscar..." className="w-full py-2 px-4 text-gray-700 rounded-l-md focus:outline-none" />
                        <button className="p-2"><SearchIcon /></button>
                    </div>
                </div>
            </header>
        );

        const FlagIcon = ({ code }) => (<img src={`https://flagcdn.com/w20/${code}.png`} width="20" alt={`${code} flag`} />);

        const Footer = () => (
            <footer className="bg-blue-900 text-white">
                <div className="container mx-auto px-4 py-8">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                        <div>
                            <h4 className="font-bold text-lg mb-2 border-b-2 border-blue-700 pb-1">ÚNETE PARA MÁS</h4>
                            <a href="./register.html" className="hover:text-gray-300">Regístrate</a>
                        </div>
                        <div></div>
                        <div className="text-left md:text-right">
                            <h4 className="font-bold text-lg mb-2">INFO</h4>
                            <ul>
                                <li><a href="#" className="hover:text-gray-300 text-sm">TÉRMINOS Y CONDICIONES</a></li>
                                <li><a href="#" className="hover:text-gray-300 text-sm">CONTÁCTANOS</a></li>
                                <li><a href="#" className="hover:text-gray-300 text-sm">POLÍTICA LEGAL</a></li>
                            </ul>
                        </div>
                    </div>
                    <div className="mt-8 pt-4 border-t border-blue-700 flex flex-col md:flex-row justify-between items-center text-xs text-gray-400">
                        <p>© 2024 - MiTiendaOnline | Tecnología de Vangard | Designed by The Anders DMP Group</p>
                        <div className="flex items-center space-x-2 mt-4 md:mt-0">
                            <FlagIcon code="cl" /><FlagIcon code="ar" /><FlagIcon code="pe" /><FlagIcon code="co" /><FlagIcon code="mx" /><FlagIcon code="us" />
                        </div>
                    </div>
                </div>
            </footer>
        );
        
        const ImageIcon = () => (
            <svg className="w-24 h-24 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1} d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
        );

        // --- PAGE-SPECIFIC COMPONENT ---
        const RegisterPage = () => {
            const InputField = ({ label, id, type, placeholder }) => (
                <div>
                    <label className="block text-gray-700 text-xs font-bold mb-1" htmlFor={id}>{label}</label>
                    <input className="shadow-sm appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" id={id} type={type} placeholder={placeholder} />
                </div>
            );
            return (
                 <div className="container mx-auto px-4 py-12 flex flex-col items-center">
                    <h1 className="text-3xl font-bold mb-8 text-gray-800">REGISTRO</h1>
                    <div className="bg-white rounded-lg shadow-xl overflow-hidden w-full max-w-5xl flex">
                        <div className="w-1/3 bg-gray-100 hidden lg:flex items-center justify-center p-12">
                           <div className="w-64 h-64 bg-gray-200 rounded-full flex items-center justify-center">
                                <ImageIcon />
                             </div>
                        </div>
                        <div className="w-full lg:w-2/3 p-8 md:p-12">
                            <form>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                    <InputField label="Nombre" id="nombre" type="text" placeholder="Juan..." />
                                    <InputField label="Apellido" id="apellido" type="text" placeholder="Perez..." />
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                    <InputField label="Email" id="email" type="email" placeholder="mail@mail.com" />
                                    <InputField label="Edad" id="edad" type="number" placeholder="18..." />
                                </div>
                                <div className="mb-4">
                                    <InputField label="Contraseña" id="password" type="password" placeholder="********" />
                                </div>
                                <div className="mb-6">
                                    <InputField label="Confirmar contraseña" id="confirm-password" type="password" placeholder="********" />
                                </div>
                                <div className="flex justify-center">
                                    <button className="bg-black text-white font-bold py-3 px-8 rounded-lg hover:bg-gray-800 focus:outline-none focus:shadow-outline transition duration-300" type="button">
                                        Registrar
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };
        
        // --- MAIN APP COMPONENT ---
        const App = () => {
            return (
                <div className="bg-gray-100 min-h-screen flex flex-col">
                    <Header />
                    <main className="flex-grow">
                        <RegisterPage />
                    </main>
                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
