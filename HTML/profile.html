<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-commerce App - Perfil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        // --- DATA ---
        const USER_PUBLICATIONS = [
            { id: 1, name: 'Guía de Estudio Cálculo I', category: 'Apuntes', price: 10000, imageUrl: 'https://images.unsplash.com/photo-1543269865-cbf427effbad?w=300&h=300&fit=crop&q=80' },
            { id: 2, name: 'Asesoría Química Orgánica', category: 'Servicios', price: 15000, imageUrl: 'https://images.unsplash.com/photo-1576092762791-ddc29a265b53?w=300&h=300&fit=crop&q=80' },
            { id: 3, name: 'Resumen Biología Celular', category: 'Exámenes', price: 8000, imageUrl: 'https://images.unsplash.com/photo-1532012197267-da84d127e765?w=300&h=300&fit=crop&q=80' }
        ];

        // --- HELPER FUNCTIONS ---
        const formatPrice = (price) => `$${price.toLocaleString('es-CL')}`;

        // --- REUSABLE COMPONENTS (Shared across pages) ---
        const LogoIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" className="h-10 w-10 text-blue-900" viewBox="0 0 20 20" fill="currentColor"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z" /></svg>);
        const SearchIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>);
        const UserIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" className="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0z" /></svg>);

        const Header = () => (
            <header className="bg-blue-900 shadow-md sticky top-0 z-50">
                <div className="container mx-auto px-4 py-3 flex items-center justify-between">
                    <a href="./index.html" className="flex items-center">
                        <div className="bg-white p-1 rounded-full"><LogoIcon /></div>
                    </a>
                    <div className="flex-1 max-w-xl mx-4 hidden md:flex items-center bg-white rounded-md">
                        <input type="text" placeholder="Buscar productos, servicios y más..." className="w-full py-2 px-4 text-gray-700 rounded-l-md focus:outline-none" />
                        <button className="p-2"><SearchIcon /></button>
                    </div>
                    <div className="flex items-center space-x-4">
                        <div className="hidden sm:flex flex-col">
                            <a href="./login.html" className="text-center bg-white text-blue-900 font-semibold py-1 px-4 rounded-t-md hover:bg-gray-200 transition duration-300 text-xs">Iniciar sesión</a>
                            <a href="./register.html" className="text-center bg-black text-white font-semibold py-1 px-4 rounded-b-md hover:bg-gray-700 transition duration-300 text-xs">Registrarse</a>
                        </div>
                        <a href="./profile.html" className="p-1 border-2 border-white rounded-full hover:bg-white/20 transition-colors"><UserIcon /></a>
                    </div>
                </div>
                <div className="container mx-auto px-4 pb-3 md:hidden">
                    <div className="flex items-center bg-white rounded-md">
                        <input type="text" placeholder="Buscar..." className="w-full py-2 px-4 text-gray-700 rounded-l-md focus:outline-none" />
                        <button className="p-2"><SearchIcon /></button>
                    </div>
                </div>
            </header>
        );

        const FlagIcon = ({ code }) => (<img src={`https://flagcdn.com/w20/${code}.png`} width="20" alt={`${code} flag`} />);

        const Footer = () => (
            <footer className="bg-blue-900 text-white">
                <div className="container mx-auto px-4 py-8">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                        <div>
                            <h4 className="font-bold text-lg mb-2 border-b-2 border-blue-700 pb-1">ÚNETE PARA MÁS</h4>
                            <a href="./register.html" className="hover:text-gray-300">Regístrate</a>
                        </div>
                        <div></div>
                        <div className="text-left md:text-right">
                            <h4 className="font-bold text-lg mb-2">INFO</h4>
                            <ul>
                                <li><a href="#" className="hover:text-gray-300 text-sm">TÉRMINOS Y CONDICIONES</a></li>
                                <li><a href="#" className="hover:text-gray-300 text-sm">CONTÁCTANOS</a></li>
                                <li><a href="#" className="hover:text-gray-300 text-sm">POLÍTICA LEGAL</a></li>
                            </ul>
                        </div>
                    </div>
                    <div className="mt-8 pt-4 border-t border-blue-700 flex flex-col md:flex-row justify-between items-center text-xs text-gray-400">
                        <p>© 2024 - MiTiendaOnline | Tecnología de Vangard | Designed by The Anders DMP Group</p>
                        <div className="flex items-center space-x-2 mt-4 md:mt-0">
                            <FlagIcon code="cl" /><FlagIcon code="ar" /><FlagIcon code="pe" /><FlagIcon code="co" /><FlagIcon code="mx" /><FlagIcon code="us" />
                        </div>
                    </div>
                </div>
            </footer>
        );

        const ProductCard = ({ product }) => (
            <div className="bg-white rounded-lg shadow-md overflow-hidden flex">
                <div className="w-1/3 bg-gray-200"><img src={product.imageUrl} alt={product.name} className="w-full h-full object-cover" /></div>
                <div className="w-2/3 p-4 flex flex-col justify-between">
                    <div>
                        <p className="text-xs text-gray-500 uppercase">{product.category}</p>
                        <h4 className="text-md font-semibold text-gray-800">{product.name}</h4>
                    </div>
                    <div className="mt-2 flex items-baseline justify-between">
                        <span className="text-xl font-bold text-gray-800">{formatPrice(product.price)}</span>
                        <div className="bg-green-500 text-white text-xs font-bold px-2 py-1 rounded-full">NUEVO</div>
                    </div>
                </div>
            </div>
        );

        const StarRating = ({ rating }) => {
            const stars = [];
            for (let i = 1; i <= 5; i++) {
                stars.push(<svg key={i} className={`w-5 h-5 ${i <= rating ? 'text-yellow-400' : 'text-gray-300'}`} fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" /></svg>);
            }
            return <div className="flex">{stars}</div>;
        };

        // --- PAGE-SPECIFIC COMPONENT ---
        const ProfilePage = () => {
            const ProfileStat = ({ label, value, valueClass = "bg-gray-200" }) => (
                <div className="flex items-center justify-between text-sm mb-2">
                    <span className="font-bold bg-gray-200 px-3 py-1 rounded-md text-gray-700">{label}:</span>
                    <span className={`font-semibold px-3 py-1 rounded-md text-center w-24 ${valueClass}`}>{value}</span>
                </div>
            );
            const RatingItem = ({ label, rating }) => (
                 <div className="flex items-center justify-between p-2 bg-white rounded-md shadow-sm">
                    <span className="text-sm font-semibold text-gray-600">{label}:</span>
                    <StarRating rating={rating} />
                 </div>
            );

            return (
                <div className="container mx-auto px-4 py-12">
                    <div className="text-center mb-10">
                        <div className="inline-block p-4 bg-gray-200 rounded-full mb-4">
                            <svg xmlns="http://www.w3.org/2000/svg" className="h-16 w-16 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                        </div>
                        <h1 className="text-2xl font-bold text-gray-800">Nombre de usuario</h1>
                    </div>
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        {/* Left Column */}
                        <div className="lg:col-span-1 space-y-8">
                            <div>
                                <ProfileStat label="Nivel" value="BRONCE" valueClass="bg-orange-400 text-white font-bold" />
                                <ProfileStat label="Reputación" value="x pts." />
                                <ProfileStat label="Cantidad pub." value="x" />
                            </div>
                            <div>
                                <h3 className="text-xl font-bold mb-4 text-gray-800">Calificaciones:</h3>
                                <div className="space-y-3">
                                   <RatingItem label="Amabilidad" rating={5} />
                                   <RatingItem label="Claridad" rating={4} />
                                   <RatingItem label="Disponibilidad" rating={5} />
                                   <RatingItem label="Responsabilidad" rating={4} />
                                   <RatingItem label="Puntualidad" rating={5} />
                                </div>
                            </div>
                        </div>
                        {/* Right Column */}
                        <div className="lg:col-span-2">
                            <h2 className="text-xl font-bold mb-4 text-gray-800">Últimas publicaciones:</h2>
                            <div className="space-y-4">
                                {USER_PUBLICATIONS.map(pub => <ProductCard key={pub.id} product={pub} />)}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP COMPONENT ---
        const App = () => {
            return (
                <div className="bg-gray-100 min-h-screen flex flex-col">
                    <Header />
                    <main className="flex-grow">
                        <ProfilePage />
                    </main>
                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
